# GitHub Pages への自動デプロイ (gh-pages ブランチ方式)
#
# push のたびに静的ビルドし、成果物 (out/) を gh-pages ブランチへ公開する。
# Actions の自動有効化はトークン権限の都合で使えないため、ブランチ方式を採用。
# 非デフォルトブランチ (claude/**) からでも確実にデプロイできる。
#
# 【初回のみ手動設定が必要】
#   リポジトリ Settings → Pages → Build and deployment →
#     Source = "Deploy from a branch"
#     Branch = "gh-pages" / "(root)" → Save
#   これで https://playmark0227-svg.github.io/tunagaru/ で公開される。
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

# gh-pages ブランチへ push するため contents: write が必要
permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build
        env:
          # プロジェクトサイトのサブパス。リポジトリ名に合わせる。
          NEXT_PUBLIC_BASE_PATH: /tunagaru

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy: ${{ github.sha }}"
